- date: 2026-05-17
  title: USC IMPACT LAB launches new GitHub-hosted website
  image: /assets/images/hero-images/hero-1.jpeg
  alt: IMPACT LAB research visual used for the new website announcement.
  summary: USC IMPACT LAB has launched a new GitHub-hosted website after the previous site went offline due to computer hardware failure.
  description: >-
    USC IMPACT LAB is pleased to launch its new website. Our previous lab site
    went offline about two months ago after a computer crash and eventual
    hardware damage. The new site is hosted through GitHub, which makes the lab
    website easier to maintain, version, update, and recover without relying on
    a single local machine. The site now provides a more stable home for our
    research themes, projects, people, publications, sponsors, collaborators,
    and news. We will continue updating the content over time and welcome
    feedback from lab members, alumni, collaborators, sponsors, and visitors.
    Please let us know if you notice missing information, have suggestions for
    improvement, or would like to contribute content.
- date: 2026-05-12
  title: BRIDGE-AIDIO project kick-off meeting held
  image: /assets/images/news/bridge-aidio-kickoff.png
  alt: BRIDGE-AIDIO kick-off meeting graphic with IMPACT Lab, MTI, and OCEANS logos.
  summary: USC IMPACT LAB, MTI, and OCEANS at the University of Osaka held the BRIDGE-AIDIO project kick-off meeting to review early progress and plan collaboration logistics.
  description: >-
    The BRIDGE-AIDIO project team held its kick-off meeting on May 12 (13 in Japan), 2026,
    bringing together, among many participants, Drs. Ando and Kakuta from MTI, Profs. Ichinose and Sakai
    from OCEANS at the University of Osaka, and Prof. Yan Jin from USC IMPACT
    LAB. Prof. Jin presented the research activities completed during the past
    month and summarized the current status of the AIDIO project. The meeting
    then moved into a productive discussion on collaboration logistics between
    USC and the teams in Japan, including coordination mechanisms, information
    sharing, and near-term development priorities. The next step for the project
    is to develop and test the first prototype AIDIO system, establishing an
    initial foundation for AI-integrated ship design, inspection, and
    optimization research.
- date: 2026-05-06
  title: Three IMPACT LAB papers accepted to IDETC/CIE 2026
  image: /assets/images/news/idetc2026.png
  alt: IDETC/CIE 2026 conference graphic.
  summary: Three IMPACT LAB papers on agentic systems modeling, self-organizing manufacturing, and AI-assisted systems engineering were accepted to ASME IDETC/CIE 2026.
  description: >-
    We are pleased to share that three papers from USC IMPACT LAB have been
    accepted to the ASME 2026 International Design Engineering Technical
    Conferences & Computers and Information in Engineering Conference
    (IDETC/CIE 2026), to be held August 23-26, 2026 in Houston, Texas. The
    accepted papers reflect the lab's growing research portfolio in agentic AI
    for engineering systems, self-organizing manufacturing, and domain knowledge
    acquisition for AI-assisted systems engineering. The papers are: "SEMAA: An
    Agentic AI Approach to Systems Modeling" by Ardalan Aryashad and Yan Jin; "A
    Phase-I Benchmark of Self-Organizing Manufacturing Control Under
    Heterogenity and Volatility" by Jian Ni, Shih-Chun Deng, and Yan Jin; and
    "Domain Knowledge Acquisition in AI-Assisted Systems Engineering" by Sara
    Sourani, Shih-Chun Deng, and Yan Jin. Congratulations to Ardalan, Jian,
    Shih-Chun, Sara, and Prof. Jin on this exciting milestone.
- date: 2026-05-05
  title: Chuanhui Hu and Yan Jin paper published online in JCISE
  image: /assets/images/news/hu-jin-jcise-online.png
  alt: News graphic for the JCISE paper on enhanced deep reinforcement learning for motion planning.
  summary: A paper by former IMPACT LAB member Dr. Chuanhui Hu and Prof. Yan Jin has been published online in JCISE.
  description: >-
    We are pleased to announce that the paper "An Enhanced Deep Reinforcement
    Learning Approach to Motion Planning With Knowledge Transfer and Online
    Demonstrations" by former IMPACT LAB member Dr. Chuanhui Hu and Prof. Yan
    Jin has been published online in the ASME Journal of Computing and
    Information Science in Engineering. The work advances deep reinforcement
    learning for long-range motion planning by combining high-level planning
    policies, knowledge transfer, and online demonstrations from global planning
    algorithms. This approach improves training efficiency and navigation
    performance while addressing key challenges such as sparse rewards,
    long-horizon decision-making, and adaptation in complex environments.
    Congratulations to Dr. Hu on this important publication and continued
    contribution to intelligent motion planning research.
- date: 2026-05-01
  title: Collaborative DOE Genesis Mission proposal submitted
  image: /assets/images/news/doe-genesis-proposal.png
  alt: Graphic for a DOE Genesis Mission proposal on agentic digital twins for additive manufacturing and fusion energy systems.
  summary: USC IMPACT LAB joined a multi-institutional team in submitting a collaborative proposal to the DOE Genesis Mission program.
  description: >-
    USC IMPACT LAB joined collaborators from the University of Utah, Oak Ridge
    National Laboratory, and Arizona State University in submitting a proposal
    to the Department of Energy's Genesis Mission program. The proposal,
    "Agentic Digital Twin for Closed-Loop Design and Monitoring of Additively
    Manufactured Fusion Energy Reactors," responds to the Genesis challenge
    area on reenvisioning advanced manufacturing and industrial productivity.
    The proposed work aims to connect additive manufacturing, in-service
    nondestructive evaluation, uncertainty-aware digital twins, and agentic AI
    decision support for fusion-relevant reactor components operating in
    extreme environments. IMPACT LAB's contribution focuses on agentic AI
    workflows and human-in-the-loop engineering decision support, helping bridge
    sensing evidence, digital twin reasoning, compliance checking, and adaptive
    redesign. The submission reflects the lab's growing commitment to AI-enabled
    engineering systems that can accelerate science, strengthen advanced
    manufacturing, and support future energy technologies.
- date: 2026-04-15
  title: Shih-Chun (Morris) Deng admitted to USC AME Ph.D. program
  image: /assets/images/people/morris.png
  alt: Shih-Chun Morris Deng.
  summary: IMPACT LAB congratulates Shih-Chun (Morris) Deng on his admission to the USC AME Ph.D. program beginning Fall 2026.
  description: >-
    USC IMPACT LAB warmly congratulates Shih-Chun (Morris) Deng on his
    admission to the USC Department of Aerospace and Mechanical Engineering
    Ph.D. program, with enrollment beginning in the Fall 2026 semester. Morris
    joined the lab in September 2025 after taking Prof. Yan Jin's AME 505
    Machine Learning for Engineering Applications course. Since then, he has
    actively participated in and contributed to several ongoing IMPACT LAB
    projects, bringing curiosity, technical energy, and steady commitment to the
    team's research activities. We are delighted to welcome Morris as he
    formally joins the lab as a Ph.D. student, and we wish him great success as
    he begins this next stage of his research journey.
- date: 2026-02-17
  title: AIDIO proposal submitted to NMRI BRIDGE program
  image: /assets/images/news/bridge-aidio-proposal.png
  alt: BRIDGE-AIDIO proposal graphic showing AI-integrated ship design, inspection, optimization, and robotic shipbuilding.
  summary: IMPACT LAB and MTI Co., Ltd. submitted the AIDIO proposal to Japan's National Maritime Research Institute as part of the BRIDGE program.
  description: >-
    USC IMPACT LAB joined MTI Co., Ltd. and submitted the proposal "AIDIO:
    AI-integrated Design, Inspection and Optimization" to Japan's National
    Maritime Research Institute (NMRI) on February 17, 2026. The proposal is
    part of the BRIDGE program, which aims to bridge research and development
    with Society 5.0 and generate economic and social value. AIDIO seeks to
    realize AI-integrated engineering in the shipbuilding domain by connecting
    the full pathway from customer needs, to basic design, to robotic
    shipbuilding. The proposed work envisions an intelligent digital thread in
    which AI agents support design generation, rule-grounded inspection,
    optimization, and production-ready data preparation. By linking early
    requirements with downstream robotic construction, AIDIO aims to help
    future shipyards use AI not only as a design assistant, but as a coordinated
    engineering capability for more productive, traceable, and automation-ready
    shipbuilding.
- date: 2025-12-18
  title: SmartSOM proposal submitted to NSF with CSU Fullerton collaborator
  image: /assets/images/news/smartsom-nsf-proposal.png
  alt: SmartSOM NSF proposal graphic showing self-organizing manufacturing concepts.
  summary: IMPACT LAB submitted an NSF proposal on SmartSOM with collaborator Prof. Bingling Huang at CSU Fullerton.
  description: >-
    USC IMPACT LAB submitted an NSF proposal on SmartSOM in collaboration with
    Prof. Bingling Huang at California State University, Fullerton. The proposed
    research investigates the theoretical and technical foundations for a
    self-organizing, multiagent manufacturing integration framework designed for
    highly volatile personalized production environments. The project plan
    builds on task-constraint modeling, social learning, and organizational
    learning to help manufacturing agents coordinate dynamic scheduling,
    resource allocation, and process control without relying on rigid
    centralized control. The research will study how task constraints can
    generalize to heterogeneous manufacturing domains, how peer observation can
    accelerate learning and improve team performance, how organizational norms
    can emerge among agent teams, and how robustness, adaptability, quality, and
    efficiency can be measured and balanced. Through simulation and
    experiment-in-the-loop validation, SmartSOM aims to advance intelligent,
    resilient, and human-centered manufacturing systems for future personalized
    markets.
- date: 2025-08-20
  title: IMPACT LAB presents robotics papers at IDETC/CIE 2025
  image: /assets/images/hero-images/hero-5.jpeg
  alt: IMPACT LAB research visual for IDETC/CIE 2025 conference presentations.
  summary: IMPACT LAB presented two robotic manipulation papers at ASME IDETC/CIE 2025 in Anaheim, California.
  description: >-
    USC IMPACT LAB presented two papers at the ASME 2025 International Design
    Engineering Technical Conferences & Computers and Information in Engineering
    Conference (IDETC/CIE 2025), held August 17-20, 2025 in Anaheim,
    California. Ardalan Aryashad presented "VLAG: Graph-Based Planning for
    Vision-Language-Action Models in Long Horizon Manipulation Tasks," which
    introduces a modular graph-based planning framework for vision-language-
    action robotic manipulation. Prof. Yan Jin also presented "Knowledge
    Capture, Adaptation and Composition (KCAC): A Framework for Cross-Task
    Curriculum Learning in Robotic Manipulation" on behalf of Dr. Xinrui
    (Serena) Wang, a former IMPACT LAB Ph.D. student. Together, the two papers
    highlight the lab's growing research direction in robotic intelligence,
    reinforcement learning, curriculum learning, and modular planning methods
    for long-horizon manipulation tasks.
- date: 2025-08-18
  title: Yan Jin receives the ASME Design Theory and Methodology Award
  image: /assets/images/hero-images/hero-6.jpeg
  alt: IMPACT LAB research visual for the ASME Design Theory and Methodology Award announcement.
  summary: Prof. Yan Jin received the ASME Design Theory and Methodology Award for contributions to research, teaching, service, and design engineering.
  description: >-
    USC IMPACT LAB is proud to celebrate Prof. Yan Jin's receipt of the ASME
    Design Theory and Methodology Award. Established by ASME's Design
    Engineering Division, the award recognizes sustained and meritorious
    contributions to research, education, service, training of researchers or
    practitioners, leadership, or a combination of these contributions in the
    field of Design Theory and Methodology. Prof. Jin's citation reads: "For
    exemplary contributions to research, teaching, and service in Design Theory
    and Methodology and for advancing knowledge in organizational and
    collaborative engineering, autonomous, and self-organizing systems." This
    recognition reflects a long-standing body of work that has shaped IMPACT
    LAB's research foundations in AI-integrated and human-centered engineering design,
    organizational modeling, autonomous systems, and self-organizing intelligent
    engineering systems.
  links:
